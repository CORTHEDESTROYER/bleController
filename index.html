<!DOCTYPE html>
<html>

<head>
  <title>BLE LED Control</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/addons/p5.sound.min.js"></script>
</head>

<body>
  <h2>arduino stuff</h2>
  <button onclick="connect()">Connect</button>
  <br><br>
  <input type="range" min="0" max="255" value="128" id="slider" oninput="setBrightness(this.value)">
  <p>Brightness: <span id="val">128</span></p>
  <p>angle: <span id="stickA">128</span></p>
  <p>magnitude: <span id="stickM">128</span></p>
  
  <p>left: <span id="lV">0</span></p>
  <p>right: <span id="rV">0</span></p>
  
  <p id="status"></p>
  

  <script>
    let brightnessChar;
    let lastWrite = 0;
    let debounceTimeout;

    async function connect() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Nano33BLE_LED' }],
          optionalServices: ['26738915-1234-4321-1234-1a2b3c4d5e6f'] // custom service UUID
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('26738915-1234-4321-1234-1a2b3c4d5e6f');
        brightnessChar = await service.getCharacteristic('4d3c2b1a-4321-1234-4321-280980280980');

        document.getElementById("status").innerText = "Connected to " + device.name;
      } catch (error) {
        document.getElementById("status").innerText = "Error: " + error;
      }
    }

    function setBrightness(val) {
      document.getElementById("val").innerText = val;

      if (brightnessChar) {
        const now = Date.now();
        const data = new Uint8Array([Number(val)]);

        // Throttle: send updates at most every 100ms while slider is moving
        if (now - lastWrite > 100) {
          lastWrite = now;
          writeValue(data);
        }

        // Debounce: ensure one final update after slider stops moving
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => {
          writeValue(data);
        }, 150); // final update after 150ms of inactivity
      }
    }

    async function writeValue(data) {
      try {
        if (!brightnessChar.service.device.gatt.connected) {
          await brightnessChar.service.device.gatt.connect();
        }
        await brightnessChar.writeValue(data);
      } catch (e) {
        console.error("Write failed:", e);
        document.getElementById("status").innerText = "Write failed: " + e;
      }
    }
    
    
  </script>
  <script>
    function setup(){
  createCanvas(windowWidth-11,windowHeight/2);
  angleMode(DEGREES);
  textAlign(CENTER);
}

function draw(){
  background(255);
  
  //stick, probably unused
  
  noStroke();
  fill(200);
  
  let lv=0;
  let rv=0;
  
  //why did i make it three? yes.
  
  if(keyIsDown(87)){ // W
    lv+=3;
    rv+=3;
  }
  
  if(keyIsDown(65)){ // A
    lv-=1.5;
    rv+=1.5;
  }
  
  if(keyIsDown(68)){ // D
    lv+=1.5;
    rv-=1.5;
  }
  
  if(keyIsDown(83)){ // S
    lv-=3;
    rv-=3;
  }
  
  
  rv=max(-3,min(rv,3));
  lv=max(-3,min(lv,3));
  
  fill(200);
  
  rect(15,15,130,250);
  fill(190);
  rect(15,140,130,125);
  
  fill(100);
  rect(20,140,30,-lv*40);
  rect(110,140,30,-rv*40);
  
  document.getElementById("lV").innerText=round(map(lv,0,3,0,128),1)+128;
  document.getElementById("rV").innerText=round(map(rv,0,3,0,128),1)+128;
  
  fill(50,5,0150);
  rect(width-90,10,80,50);
  fill(255);
  text("double click\nto connect",width-50,33);
  
}

function insiderect(x,y,rx,ry,rw,rh){
  return (x>rx && x<rx+rw && y>ry && y<ry+rh);
}

function doubleClicked(){
  if(insiderect(mouseX,mouseY,width-90,10,80,50)){
    connect();
  }
}</script>
</body>

</html>
