<!DOCTYPE html>
<html>

<head>
  <title>developments</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/addons/p5.sound.min.js"></script>
</head>

<body>
  <!-- html more like htmwho cares
  <h2>what is a pin anyway, if you really think about it</h2>

  <button onclick="connect()">Connect</button>
  <br><br>
 <input type="range" min="0" max="255" value="128" id="slider" oninput="setBrightness(this.value)">
  <p>d1/lv according to html: <span id="d1val">128</span></p>
  <p>d1/rv according to html: <span id="d2val">128</span></p>
  
  <p>left: <span id="lV">0</span></p>
  <p>right: <span id="rV">0</span></p>
-->
  
  <p id="status"></p>
  

  <script>
    let brightnessChar;
    let d1Char;
    let d2Char;

    async function connect() { //this works; don't worry about how
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'CDJST Motor Car' }],
          optionalServices: ['26738915-1234-4321-1234-1a2b3c4d5e6f'] // custom service UUID
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('26738915-1234-4321-1234-1a2b3c4d5e6f');
        brightnessChar = await service.getCharacteristic('4d3c2b1a-4321-1234-4321-280980280980');
        d1Char = await service.getCharacteristic('4d3c2b1a-4321-1234-4321-d1d1d1d1d1d1');
        d2Char = await service.getCharacteristic('4d3c2b1a-4321-1234-4321-d2d2d2d2d2d2');

        document.getElementById("status").innerText = "Connected to " + device.name;
      } catch (error) {
        document.getElementById("status").innerText = "imagine not connecting:  " + error;
      }
    }

    function setChar(val,Char) { //generic thing you call for output
      if(Char) {
        const data = new Uint8Array([Number(val)]);
        writeValue(data,Char);
      }
    }

    async function writeValue(data,Char) { //generic deployment
      try {
        if (!Char.service.device.gatt.connected) {
          await Char.service.device.gatt.connect();
        }
        await Char.writeValue(data);
      } catch (e) {
        console.error("i have news!", e);
        document.getElementById("status").innerText = "did someone say " + e;
      }
    }
    
    // screw dis we simplifying; p5 injected here
    
    let scalar;

    function setup(){
      let w=windowWidth-15;
      let h=windowHeight-15;
      let wr=w/1000;
      let hr=h/600;
      scalar=min(wr,hr);
      if(wr>hr){
        createCanvas(h*5/3,h);
      } else {
        createCanvas(w,w*3/5);
      }
      angleMode(DEGREES);
      textAlign(CENTER);
      noStroke();
    }

    function draw(){
      scale(scalar);
      background(255);
      
      let lv=0; //d1
      let rv=0; //d2
  
  //why did i make it three? yes.
  
      if(keyIsDown(87)){ // W
        lv+=3;
        rv+=3;
      }
      if(keyIsDown(65)){ // A
        lv-=1.5;
        rv+=1.5;
      }
      if(keyIsDown(68)){ // D
        lv+=1.5;
        rv-=1.5;
      }
      if(keyIsDown(83)){ // S
        lv-=3;
        rv-=3;
      }
  
      rv=max(-3,min(rv,3));
      lv=max(-3,min(lv,3));
      
      if(keyIsDown(16)){ //slow if shift
        rv*=0.5;
        lv*=0.5;
      }
      
      fill(200);  //display speeds
      rect(30,50,150,500);
      fill(190);
      rect(30,300,150,250);
  
      fill(100);
      rect(40,300,40,-lv*78);
      rect(130,300,40,-rv*78);
  
  
      lv=max(0,round(map(lv,0,3,0,128),1)+127)
      rv=max(0,round(map(rv,0,3,0,128),1)+127)
  
      let heldWASD=keyIsDown(87) || keyIsDown(65) || keyIsDown(68) || keyIsDown(83);
      if(frameCount%10>5){     //this         sucks
        if(heldWASD){
          setChar(lv,d1Char);
        } else {
          setChar(127,d1Char);
        }
      } else {
        if(heldWASD){
          setChar(rv,d2Char);
        } else {
          setChar(127,d2Char);
        }
      }
      //you may have noticed that this is the last thing with lv & rv
      //they change so much; this keeps the display accurate
      
      //bluetooth button

      fill(50,50,insiderect(mouseX/scalar,mouseY/scalar,1000-150,20,130,70)?250:150);
      rect(1000-150,20,130,70);
      fill(255);  
      if(frameCount%10===0){
       // setBrightness(round(sin(frameCount*1.2)*127+127),1);
      }
  
    }

    function insiderect(x,y,rx,ry,rw,rh){ //for bt button
      return (x>rx && x<rx+rw && y>ry && y<ry+rh);
    }

    function doubleClicked(){ //for, too, bt button
      if(insiderect(mouseX/scalar,mouseY/scalar,1000-150,20,130,70)){
        connect();
      }
    }
    
    function windowResized(){ // ~ aesthetics ~
      let w=windowWidth-15;
      let h=windowHeight-15;
      let wr=w/1000;
      let hr=h/600;
      scalar=min(wr,hr);
      if(wr>hr){
        resizeCanvas(h*5/3,h);
      } else {
        resizeCanvas(w,w*3/5);
      }
    }
    
  </script>
</body>

</html>
